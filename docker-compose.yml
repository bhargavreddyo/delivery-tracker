services:
  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: delivery
      POSTGRES_DB: delivery

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery -d delivery"]
      interval: 5s
      timeout: 5s
      retries: 5



  redis:
    image: redis:7

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5



  migrate:
    image: postgres:16

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      PGPASSWORD: delivery

    volumes:
      - ./migrations:/migrations:ro

    command: >
      sh -c "
      psql -h postgres -U delivery -d delivery -f /migrations/001_schema.sql &&
      psql -h postgres -U delivery -d delivery -f /migrations/002_seed.sql
      "



  app:
    build: .

    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql://delivery:delivery@postgres:5432/delivery
      REDIS_URL: redis://redis:6379/0

    ports:
      - "8080:8080"




volumes:
  postgres_data: